name: Python CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-learning .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build package
        run: |
          mkdir -p dist
          tar -czf dist/cicd-learning.tar.gz app.py test_app.py requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-learning-package
          path: dist/cicd-learning.tar.gz

      - name: Run tests
        run: python -m unittest test_app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-learning-package

      - name: Build Docker image
        run: docker build -t cicd-learning .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag cicd-learning:latest namrathatg/cicd-learning:latest
          docker tag cicd-learning:latest namrathatg/cicd-learning:v1

      - name: Push Docker image
        run: |
          docker push namrathatg/cicd-learning:latest
          docker push namrathatg/cicd-learning:v1

      - name: Deploy package
        run: |
          mkdir -p deployment
          echo "Deploying application..."
          ls -la

      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "docker pull namrathatg/cicd-learning:latest && \
             docker stop cicd-app || true && \
             docker rm cicd-app || true && \
             docker run -d --name cicd-app -p 8000:8000 namrathatg/cicd-learning:latest"