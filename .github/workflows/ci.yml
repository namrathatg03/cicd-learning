name: Python CI

on:
  push:
    tags:
    - "v*"
    - "staging"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build package
        run: |
          mkdir -p dist
          tar -czf dist/cicd-learning.tar.gz app.py test_app.py requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-learning-package
          path: dist/cicd-learning.tar.gz

      - name: Run tests
        run: python -m unittest test_app.py

  deploy:
    needs: test
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-learning-package

      - name: Build Docker image
        run: docker build -t cicd-learning .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag cicd-learning:latest namrathatg/cicd-learning:${{ github.ref_name }}

      - name: Push Docker image
        run: |
          docker push namrathatg/cicd-learning:${{ github.ref_name }}

      - name: Deploy package
        run: |
          mkdir -p deployment
          echo "Deploying application..."
          ls -la

      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "CURRENT_IMAGE=\$(docker inspect cicd-app --format '{{.Config.Image}}') && \
             echo \"Current image: \$CURRENT_IMAGE\" && \
             docker pull namrathatg/cicd-learning:${{ github.ref_name }} && \
             docker stop cicd-app || true && \
             docker rm cicd-app || true && \
             docker run -d --name cicd-app -p 8000:8000 namrathatg/cicd-learning:${{ github.ref_name }} && \
             sleep 2 && \
             if curl -f http://localhost:8000; then \
               echo 'Deployment successful'; \
             else \
               echo 'Deployment failed - rolling back'; \
               docker stop cicd-app || true; \
               docker rm cicd-app || true; \
               docker run -d --name cicd-app -p 8000:8000 \$CURRENT_IMAGE && \
               sleep 2 && \
               if curl -f http://localhost:9999; then \
                 echo 'Rollback successful - restored \$CURRENT_IMAGE'; \
               else \
                 echo 'CRITICAL: Rollback failed'; \
                 exit 1; \
               fi; \
               exit 1; \
             fi"
