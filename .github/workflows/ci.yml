name: Python CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build package
        run: |
          mkdir -p dist
          tar -czf dist/cicd-learning.tar.gz app.py test_app.py requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-learning-package
          path: dist/cicd-learning.tar.gz

      - name: Run tests
        run: python -m unittest test_app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy package
        run: |
          mkdir -p deployment
          echo "Deploying application..."